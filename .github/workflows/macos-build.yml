name: macOS build

on:
  push:
    branches:
      - main
      - macos-virtual-desktop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: SwiftPM / macOS 15
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out SwiftXR
        uses: actions/checkout@v4

      - name: Toolchain information
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          cmake --version

      - name: Build and install Khronos OpenXR loader
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 https://github.com/KhronosGroup/OpenXR-SDK.git "$RUNNER_TEMP/OpenXR-SDK"

          cmake \
            -S "$RUNNER_TEMP/OpenXR-SDK" \
            -B "$RUNNER_TEMP/OpenXR-SDK-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DDYNAMIC_LOADER=ON \
            -DBUILD_TESTS=OFF

          cmake --build "$RUNNER_TEMP/OpenXR-SDK-build" --config Release --parallel
          sudo cmake --install "$RUNNER_TEMP/OpenXR-SDK-build" --config Release

          test -f /usr/local/include/openxr/openxr.h
          test -f /usr/local/include/openxr/openxr_platform.h
          ls -la /usr/local/lib/libopenxr_loader*

      - name: Build complete package (debug)
        run: swift build -v

      - name: Build virtual desktop product (release)
        run: swift build -c release --product swiftxr-desktop -v
